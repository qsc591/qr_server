<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WeChat QR Board</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="left">
        <div class="left-header">
          <div class="title">位置列表</div>
          <div class="subtitle" id="stats"></div>
        </div>
        <div class="seat-list" id="seatList"></div>
      </aside>

      <main class="right">
        <div class="card">
          <div id="kbpayCard" style="display:none;">
            <div class="status-banner" id="kbBanner" style="display:none;"></div>
            <div class="kb-head">
              <span class="seq-badge" id="kbSeq">#-</span>
              <span class="site-chip" id="kbSite">-</span>
              <span class="kb-title" id="kbTitle"><span class="dot"></span>Waiting for payment</span>
            </div>
            <div class="pay-hero">
              <div class="qr-wrap">
                <div class="qr-box"><img id="kbQrImg" alt="QR" /></div>
                <div class="qr-under">用 KB Pay App 扫此码 · 或手输右侧结算码</div>
              </div>
              <div class="pay-side">
                <div class="code-box">
                  <div class="code-label">결제코드 / 结算码</div>
                  <div class="code-big" id="kbCode">-</div>
                  <div class="code-actions"><button class="btn primary" id="kbCopy" type="button">复制结算码</button></div>
                </div>
                <div class="paymethod"><span class="kbmark">KB</span><span id="kbPayM">-</span></div>
                <div class="expiry" id="kbExp">
                  <div class="cd" id="kbCd">--:--</div>
                  <div class="state" id="kbState">-</div>
                </div>
              </div>
            </div>
            <div class="kb-metagrid">
              <div class="kb-mrow full"><div class="kb-mlabel">Event</div><div class="kb-mval"><a id="kbEvent" href="#" target="_blank" rel="noreferrer">-</a></div></div>
              <div class="kb-mrow"><div class="kb-mlabel">日期 / Round</div><div class="kb-mval" id="kbDate">-</div></div>
              <div class="kb-mrow full"><div class="kb-mlabel">座位</div><div class="kb-mval" id="kbSeat">-</div></div>
              <div class="kb-mrow"><div class="kb-mlabel">价格</div><div class="kb-mval" id="kbPrice">-</div></div>
              <div class="kb-mrow"><div class="kb-mlabel">数量</div><div class="kb-mval" id="kbQty">-</div></div>
              <div class="kb-mrow full"><div class="kb-mlabel">抓取时间</div><div class="kb-mval" id="kbCap">-</div></div>
            </div>
            <div class="kb-steps">
              <div class="h">扫码步骤</div>
              <div class="kb-steps-body" id="kbStepsBody">-</div>
            </div>
            <div class="kb-msg"><a id="kbLink" href="#" target="_blank" rel="noreferrer">打开 Discord 消息</a></div>
          </div>
          <div class="meta" id="genericMeta">
            <div class="status-banner" id="statusBanner" style="display: none;"></div>
            <div class="meta-row" id="seqRow" style="display:none;">
              <div class="label">序号</div>
              <div class="value" id="curSeq">-</div>
            </div>
            <div class="meta-row">
              <div class="label">位置</div>
              <div class="value" id="curSeat">-</div>
            </div>
            <div class="meta-row">
              <div class="label">抓取时间</div>
              <div class="value" id="curCapturedAt">-</div>
            </div>
            <div id="xbotDetails" style="display:none;">
              <div class="meta-row">
                <div class="label">日期</div>
                <div class="value" id="curDate">-</div>
              </div>
              <div class="meta-row">
                <div class="label">座位</div>
                <div class="value" id="curSeatDetail">-</div>
              </div>
              <div class="meta-row">
                <div class="label">价格</div>
                <div class="value" id="curPrice">-</div>
              </div>
              <div class="meta-row">
                <div class="label">数量</div>
                <div class="value" id="curQty">-</div>
              </div>
            </div>
            <div id="ttmDetails" style="display:none;">
              <div class="meta-row">
                <div class="label">产品</div>
                <div class="value" id="ttmTitle">-</div>
              </div>
              <div class="meta-row">
                <div class="label">订单号</div>
                <div class="value mono" id="ttmOrderId">-</div>
              </div>
              <div class="meta-row">
                <div class="label">过期时间（北京时间）</div>
                <div class="value" id="ttmExpiryCn">-</div>
              </div>
            </div>
            <div class="meta-row">
              <div class="label">消息</div>
              <div class="value">
                <a id="curLink" href="#" target="_blank" rel="noreferrer">-</a>
              </div>
            </div>
          </div>

          <div class="qr" id="genericQr">
            <img id="qrImg" alt="QR" />
            <div class="qr-hint" id="qrHint">等待抓取…</div>
          </div>

          <div class="actions">
            <button id="btnNext" class="btn primary">下一个（已扫描）</button>
            <a class="btn" id="btnAlipayJump" href="#" target="_blank" rel="noreferrer" style="display:none;">点击跳转到支付宝</a>
            <a class="btn" id="btnDownloadCsv" href="/api/csv" target="_blank" rel="noreferrer">下载CSV</a>
            <a class="btn" id="btnDownloadTtmCsv" href="/api/ttm_csv" target="_blank" rel="noreferrer" style="display:none;">下载TTM订单CSV</a>
          </div>
        </div>
      </main>
    </div>

    <div class="toast" id="toast" aria-live="polite"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
